spring.application.name=kotlin-practice

# MySQL (AWS RDS) datasource - values supplied via env vars at runtime
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# H2 console must stay off outside local dev
spring.h2.console.enabled=false

# JPA / Hibernate
# NOTE: "update" is a toy-project shortcut (no migration tool). It won't drop
# removed columns and can silently drift from the entities over time - fine
# for practice, not something to carry into a real project.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
